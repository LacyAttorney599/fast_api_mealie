{% extends "base.html" %}

{% block content %}
  <h1>Recettes</h1>

  <form hx-get="/" hx-target="body" hx-push-url="true">
    <input type="search" name="q" placeholder="Rechercher une recette..." value="{{ q }}">
  </form>

  <a href="/ajouter" class="bouton">+ Nouvelle recette</a>

  <ul class="recettes">
    {% for recette in recettes %}
      <li>{{ recette.name }}</li>
    {% else %}
      <li>Aucune recette trouvée.</li>
    {% endfor %}
  </ul>
{% endblock %}
