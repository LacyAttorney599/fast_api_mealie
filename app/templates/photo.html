{% extends "base.html" %}

{% block content %}
  <h1>Importer une recette par photo</h1>

  <button type="button" id="ouvrir-camera" class="bouton" hidden>📷 Prendre une photo</button>

  <div id="camera-zone" hidden>
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="camera-controls">
      <button type="button" id="capturer-photo" class="bouton-principal">Capturer</button>
      <button type="button" id="annuler-camera">Annuler</button>
    </div>
  </div>
  <canvas id="camera-canvas" hidden></canvas>

  <form id="form-photo"
        hx-post="/import/photo"
        hx-encoding="multipart/form-data"
        hx-target="#statut"
        hx-indicator="#statut">
    <input type="file" id="input-image" name="image" accept="image/*" capture="environment" required>
    <button type="submit" class="bouton-principal">Analyser la photo</button>
  </form>

  <div id="statut" class="htmx-indicator">
    Traitement en cours (OCR puis structuration)... cela peut prendre quelques dizaines de secondes.
  </div>

  <script>
    const ouvrirBtn = document.getElementById("ouvrir-camera");
    const cameraZone = document.getElementById("camera-zone");
    const video = document.getElementById("camera-video");
    const canvas = document.getElementById("camera-canvas");
    const capturerBtn = document.getElementById("capturer-photo");
    const annulerBtn = document.getElementById("annuler-camera");
    const inputImage = document.getElementById("input-image");
    const formPhoto = document.getElementById("form-photo");
    let flux = null;

    // La capture caméra directe (getUserMedia) exige un contexte sécurisé
    // (HTTPS ou localhost) : on ne propose le bouton que si le navigateur
    // le permet, sinon le sélecteur de fichier classique reste disponible
    // (il déclenche déjà l'appareil photo natif sur mobile via `capture`).
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      ouvrirBtn.hidden = false;
    }

    ouvrirBtn.addEventListener("click", async () => {
      try {
        flux = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
        });
        video.srcObject = flux;
        cameraZone.hidden = false;
        ouvrirBtn.hidden = true;
      } catch (erreur) {
        alert("Impossible d'accéder à la caméra : " + erreur.message);
      }
    });

    function arreterCamera() {
      if (flux) {
        flux.getTracks().forEach((piste) => piste.stop());
        flux = null;
      }
      cameraZone.hidden = true;
      ouvrirBtn.hidden = false;
    }

    annulerBtn.addEventListener("click", arreterCamera);

    capturerBtn.addEventListener("click", () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      canvas.toBlob((blob) => {
        const fichier = new File([blob], "photo.jpg", { type: "image/jpeg" });
        const transfert = new DataTransfer();
        transfert.items.add(fichier);
        inputImage.files = transfert.files;
        arreterCamera();
        formPhoto.requestSubmit();
      }, "image/jpeg", 0.92);
    });
  </script>
{% endblock %}
